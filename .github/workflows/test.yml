name: Testler

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sözdizimi kontrolü
        run: for f in js/*.js js/*/*.js; do node --check "$f"; done
      - name: Motor testleri
        run: node --test tests/*.test.mjs
